PasswordAuthentication yes
PubkeyAuthentication yes
ClientAliveInterval 30
ClientAliveCountMax 6
AcceptEnv LANG LC_*
# 浏览器 MCP 反向转发(remote→local · 阶段3):OkWork 用 -R 把本机 MCP server 透到
# 容器回环 127.0.0.1:39217,session 内 agent 经此打回。OpenSSH 默认即 yes,显式声明
# 防日后加固误关(仅 loopback 绑定,无需 GatewayPorts)。
AllowTcpForwarding yes
