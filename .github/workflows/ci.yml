# 日常质量门:类型检查 + 单测。跑在 ubuntu(私有仓库 1× 计费)。
# 打包与冒烟见 release.yml(macOS,仅 tag / 手动触发)。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
