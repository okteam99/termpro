# 日常质量门:类型检查 + 单测(self-hosted Linux)。
# 打包与冒烟见 release.yml(self-hosted macOS,仅 tag / 手动触发)。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: [ubuntu-ci, linux-x64]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
