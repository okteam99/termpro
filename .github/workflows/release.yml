# 出包流水线:打 v* tag 自动构建 macOS 包并附到 GitHub Release;
# 也可在 Actions 页手动触发(workflow_dispatch)验证打包,只传 artifact 不发 Release。
# 公开仓库 GitHub-hosted runner 免费;fork PR 不注入 secrets(自动回退 ad-hoc)。
#
# 签名/公证复用 cmux-pro 的 secrets 体系(同名,见 docs/DEV.md):
#   APPLE_CERTIFICATE_BASE64 / APPLE_CERTIFICATE_PASSWORD /
#   APPLE_SIGNING_IDENTITY / APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID
# secrets 未配置时自动回退 ad-hoc 签名(首次打开需右键 → 打开)。
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # BL-003 SSH-5:三架构 host standalone 部署产物,并入 tag 流水线同一 commit
  # 现产(消版本偏斜——旧 host-package.yml 无 tag 触发器,`bundle.version` 可能
  # ≠ 本次 release version)。产物随后被 build-macos 下载、随应用 extraResource
  # 打进 Contents/Resources/host-bundles/<arch>/(见 forge.config.ts)。
  # fail-fast:false:三腿互相隔离,linux-arm64 单腿失败不牵连另外两腿;
  # 是否因此拖累 build-macos(整个发版)由下方 build-macos 的 if:!cancelled()
  # + 逐 arch 存在性判断兜底(R2-2)。
  build-host-bundles:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: darwin-arm64
            runner: macos-14
          - arch: linux-x64
            runner: ubuntu-latest
          - arch: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖(node-pty 按 runner 平台自动取预编译/源码编译)
        run: npm ci

      # 🔴 必须 --tar 后上传 tar.gz(host-package.yml 同款):upload/download-artifact
      # 走 zip,不保留文件权限 —— 裸目录上传会丢 node-pty spawn-helper 执行位,
      # 打进 app 的 bundle 部署到 darwin 远端后 pty.spawn 必挂 posix_spawnp failed
      # (0.3.42/0.3.43 事故根因;linux 远端 forkpty 不用 helper,故仅 darwin 中招)。
      - name: 打包 standalone host 产物
        run: |
          node scripts/package-host.mjs \
            --out out/host-bundle-${{ matrix.arch }} \
            --platform ${{ matrix.arch }} \
            --tar out/host-bundle-${{ matrix.arch }}.tar.gz

      - name: 验证产物(真实进程 + WS 握手 + PTY 真实 spawn)
        run: node scripts/verify-host-artifact.mjs --dir out/host-bundle-${{ matrix.arch }}

      - name: 上传产物(tar.gz 保权限)
        uses: actions/upload-artifact@v5
        with:
          name: host-bundle-${{ matrix.arch }}
          path: out/host-bundle-${{ matrix.arch }}.tar.gz
          retention-days: 14

  build-macos:
    needs: build-host-bundles
    # 🔴 R2-2(external verify):裸 needs 下,build-host-bundles 若因 linux-arm64
    # 单腿失败而整体报 failure,GitHub Actions 会默认跳过本 job → 整个 macOS
    # 发版被跳过,与「arm64 缺位应运行时降级、不阻断发版」相反。改
    # if:!cancelled()(上游非取消即运行),缺失的具体 arch 交给下方「组装」步骤
    # 逐个存在性判断:darwin-arm64/linux-x64 缺失 → fail release(必需);
    # linux-arm64 缺失 → 跳过复制、继续 make(该 arch 运行时走 detectArch 降级阀)。
    if: ${{ !cancelled() }}
    # Apple Silicon(arm64)。如需 Intel 包,改为矩阵并加 macos-13。
    runs-on: macos-14
    timeout-minutes: 40
    env:
      HAS_SIGNING: ${{ secrets.APPLE_SIGNING_IDENTITY != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查与单测
        run: |
          npm run typecheck
          npm test

      - name: 端到端冒烟(渲染层↔Host↔PTY)
        run: TERMPRO_SMOKE=1 npx electron-forge start
        timeout-minutes: 6

      # ---- SSH-5:下载三架构 host bundle,逐 arch 存在性判断(R2-2 降级阀)----
      # continue-on-error:任一 arch 的 build-host-bundles 腿失败时该 artifact
      # 从未上传,download 步骤本身会报错;不让它直接中断 job,统一交给下方
      # 「组装」步骤按 darwin-arm64/linux-x64(必需) vs linux-arm64(可选)分别判定。
      - name: 下载 darwin-arm64 host bundle
        uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          name: host-bundle-darwin-arm64
          path: /tmp/host-bundle-darwin-arm64

      - name: 下载 linux-x64 host bundle
        uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          name: host-bundle-linux-x64
          path: /tmp/host-bundle-linux-x64

      - name: 下载 linux-arm64 host bundle(允许缺失)
        uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          name: host-bundle-linux-arm64
          path: /tmp/host-bundle-linux-arm64

      - name: 组装 resources/host-bundles/<arch>/(darwin-arm64/linux-x64 必需 · linux-arm64 允许缺失)
        run: |
          set -euo pipefail
          mkdir -p resources/host-bundles
          extract() { # $1=arch;tar 解包保留执行位(cp -R 裸目录的旧口径丢 spawn-helper 0755)
            local tgz="/tmp/host-bundle-$1/host-bundle-$1.tar.gz"
            [ -f "$tgz" ] || return 1
            mkdir -p "resources/host-bundles/$1"
            tar -xzf "$tgz" -C "resources/host-bundles/$1" --strip-components 1
          }
          missing_required=()
          for arch in darwin-arm64 linux-x64; do
            if extract "$arch"; then
              echo "[host-bundles] $arch: 就绪"
            else
              echo "::error::host bundle missing for required arch: $arch"
              missing_required+=("$arch")
            fi
          done
          if extract linux-arm64; then
            echo "[host-bundles] linux-arm64: 就绪"
          else
            echo "::warning::linux-arm64 host bundle missing — 运行时 detectArch 命中该架构时走手装引导降级阀,不阻断本次发版"
          fi
          if [ ${#missing_required[@]} -gt 0 ]; then
            echo "::error::required host bundle(s) missing, failing release: ${missing_required[*]}"
            exit 1
          fi
          # 🔴 最后一道闸:spawn-helper 丢执行位 → darwin 远端 pty.spawn 必挂
          # posix_spawnp failed,且要到用户真连远程机才暴露 —— 在发版前直接 fail。
          helper="resources/host-bundles/darwin-arm64/node_modules/node-pty/build/Release/spawn-helper"
          if [ ! -x "$helper" ]; then
            echo "::error::spawn-helper 非可执行(打包链丢执行位):$helper"
            exit 1
          fi

      # ---- 签名证书导入(复用 cmux-pro 的临时 keychain 方案)----
      - name: Import signing cert
        if: env.HAS_SIGNING == 'true'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$APPLE_CERTIFICATE_BASE64" ] || [ -z "$APPLE_CERTIFICATE_PASSWORD" ]; then
            echo "Missing certificate secrets" >&2
            exit 1
          fi
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > /tmp/cert.p12
          security delete-keychain build.keychain >/dev/null 2>&1 || true
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security list-keychains -d user -s build.keychain

      - name: 打包(签名/公证由 forge osxSign/osxNotarize 接管)
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run make

      - name: Gatekeeper 验收(已签名时)
        if: env.HAS_SIGNING == 'true'
        run: |
          set -euo pipefail
          APP_PATH="$(find out -maxdepth 3 -name '*.app' -type d | head -1)"
          echo "checking $APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          spctl -a -vv --type execute "$APP_PATH"

      - name: 上传构建产物(所有触发方式)
        uses: actions/upload-artifact@v5
        with:
          name: termpro-darwin-arm64
          path: |
            out/make/**/*.zip
            out/make/**/*.dmg
          retention-days: 14

      - name: 发布 GitHub Release(仅 tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/make/**/*.zip
            out/make/**/*.dmg
          generate_release_notes: true

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain build.keychain >/dev/null 2>&1 || true
          rm -f /tmp/cert.p12
