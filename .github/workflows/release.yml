# 出包流水线:打 v* tag 自动构建 macOS 包并附到 GitHub Release;
# 也可在 Actions 页手动触发(workflow_dispatch)验证打包,只传 artifact 不发 Release。
# 公开仓库 GitHub-hosted runner 免费;fork PR 不注入 secrets(自动回退 ad-hoc)。
#
# 签名/公证复用 cmux-pro 的 secrets 体系(同名,见 docs/DEV.md):
#   APPLE_CERTIFICATE_BASE64 / APPLE_CERTIFICATE_PASSWORD /
#   APPLE_SIGNING_IDENTITY / APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID
# secrets 未配置时自动回退 ad-hoc 签名(首次打开需右键 → 打开)。
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    # Apple Silicon(arm64)。如需 Intel 包,改为矩阵并加 macos-13。
    runs-on: macos-14
    timeout-minutes: 40
    env:
      HAS_SIGNING: ${{ secrets.APPLE_SIGNING_IDENTITY != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查与单测
        run: |
          npm run typecheck
          npm test

      - name: 端到端冒烟(渲染层↔Host↔PTY)
        run: TERMPRO_SMOKE=1 npx electron-forge start
        timeout-minutes: 6

      # ---- 签名证书导入(复用 cmux-pro 的临时 keychain 方案)----
      - name: Import signing cert
        if: env.HAS_SIGNING == 'true'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$APPLE_CERTIFICATE_BASE64" ] || [ -z "$APPLE_CERTIFICATE_PASSWORD" ]; then
            echo "Missing certificate secrets" >&2
            exit 1
          fi
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > /tmp/cert.p12
          security delete-keychain build.keychain >/dev/null 2>&1 || true
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security list-keychains -d user -s build.keychain

      - name: 打包(签名/公证由 forge osxSign/osxNotarize 接管)
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run make

      - name: Gatekeeper 验收(已签名时)
        if: env.HAS_SIGNING == 'true'
        run: |
          set -euo pipefail
          APP_PATH="$(find out -maxdepth 3 -name '*.app' -type d | head -1)"
          echo "checking $APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          spctl -a -vv --type execute "$APP_PATH"

      - name: 上传构建产物(所有触发方式)
        uses: actions/upload-artifact@v5
        with:
          name: termpro-darwin-arm64
          path: out/make/**/*.zip
          retention-days: 14

      - name: 发布 GitHub Release(仅 tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/make/**/*.zip
          generate_release_notes: true

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain build.keychain >/dev/null 2>&1 || true
          rm -f /tmp/cert.p12
