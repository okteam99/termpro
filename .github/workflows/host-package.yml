# Host 独立部署产物打包 + 实机验证(TECH「阶段 F 打包 spike」步骤 15 · AC-4)。
# 独立 job/独立 workflow,不复用/不改动 release.yml 的既有 macOS 发版 gate;
# ci.yml(日常 typecheck+test)同样不受影响。
#
# matrix:
#   macos-14          → darwin-arm64(node-pty 用官方 prebuilds,npm ci 自带)
#   ubuntu-latest     → linux-x64(node-pty 无官方 linux prebuilds,npm ci 走 node-gyp 源码编译,
#                       runner 镜像自带 build-essential/python3,无需额外安装)
#   ubuntu-24.04-arm  → linux-arm64(AC-4/TC-F05:仅要求产物存在性,不要求实机验收;选用
#                       GitHub 原生 arm64 hosted runner 而非 ubuntu-latest+QEMU 仿真,是因为
#                       前者能以原生速度跑通同一套「打包+实机验证」步骤而非退化成「只查文件存在」——
#                       本地已用 Apple Silicon docker `--platform linux/arm64` 复现同一流程验证过
#                       全绿,风险低于 QEMU 仿真下 node-gyp 源码编译的不确定性)
#
# 每个 job:npm ci → 打包 standalone 产物(scripts/package-host.mjs)→ 起真实进程验证
# (scripts/verify-host-artifact.mjs:token 握手 + host.info-first 门控 + PTY 真实 spawn)
# → 产物 tar.gz 上传 artifact。
name: Host Package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  package-and-verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: darwin-arm64
          - os: ubuntu-latest
            platform: linux-x64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖(node-pty 按 runner 平台自动取预编译/源码编译)
        run: npm ci

      - name: 打包 standalone host 产物
        run: |
          node scripts/package-host.mjs \
            --out out/host-${{ matrix.platform }} \
            --platform ${{ matrix.platform }} \
            --tar out/okwork-host-${{ matrix.platform }}.tar.gz

      - name: 验证产物(真实进程 + WS 握手 + PTY 真实 spawn)
        run: node scripts/verify-host-artifact.mjs --dir out/host-${{ matrix.platform }}

      - name: 上传产物
        uses: actions/upload-artifact@v5
        with:
          name: okwork-host-${{ matrix.platform }}
          path: out/okwork-host-${{ matrix.platform }}.tar.gz
          retention-days: 14
