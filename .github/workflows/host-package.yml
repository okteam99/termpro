# Host 独立部署产物打包 + 实机验证(TECH「阶段 F 打包 spike」步骤 15 · AC-4)。
# 独立 job/独立 workflow,不复用/不改动 release.yml 的既有 macOS 发版 gate;
# ci.yml(日常 typecheck+test)同样不受影响。
#
# matrix:
#   self-hosted macOS ARM64 → darwin-arm64
#   ubuntu-ci linux-x64     → linux-x64
#   ubuntu-24.04-arm        → linux-arm64(GitHub 托管 ARM Linux,公开仓库免费;
#     node-pty 1.1.0 无 linux prebuilds,必须在原生 arm64 上源码编译)
#
# 每个 job:npm ci → 打包 standalone 产物(scripts/package-host.mjs)→ 起真实进程验证
# (scripts/verify-host-artifact.mjs:token 握手 + host.info-first 门控 + PTY 真实 spawn)
# → 产物 tar.gz 上传 artifact。
name: Host Package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  package-and-verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: [self-hosted, macOS, ARM64]
            platform: darwin-arm64
          - runner: [ubuntu-ci, linux-x64]
            platform: linux-x64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: 安装依赖(node-pty 按 runner 平台自动取预编译/源码编译)
        run: npm ci

      - name: 打包 standalone host 产物
        run: |
          node scripts/package-host.mjs \
            --out out/host-${{ matrix.platform }} \
            --platform ${{ matrix.platform }} \
            --tar out/okwork-host-${{ matrix.platform }}.tar.gz

      - name: 验证产物(真实进程 + WS 握手 + PTY 真实 spawn)
        run: node scripts/verify-host-artifact.mjs --dir out/host-${{ matrix.platform }}

      - name: 上传产物
        uses: actions/upload-artifact@v5
        with:
          name: okwork-host-${{ matrix.platform }}
          path: out/okwork-host-${{ matrix.platform }}.tar.gz
          retention-days: 14

      - name: 同名 Host Artifact 仅保留最新一份
        # fork / Dependabot PR 的 GITHUB_TOKEN 强制只读；它们留下的副本会由
        # 下一次主仓库 push / workflow_dispatch 清理。
        if: >-
          ${{
            (github.event_name != 'pull_request' ||
             github.event.pull_request.head.repo.full_name == github.repository) &&
            github.actor != 'dependabot[bot]'
          }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/retain-latest-artifacts.mjs okwork-host-${{ matrix.platform }}
